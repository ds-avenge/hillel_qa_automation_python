name: jenkins

services:
  jenkins:
    build:
      context: .
      dockerfile: JenkinsDockerfile

    container_name: jenkins
    privileged: true
    user: root

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - homeworks_30_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  homeworks_30_jenkins_home:
    external: true
